# Aksa Xiterz static asset compression and caching.
# Installed inside the HTTPS server block by aksaxiterz-deploy.sh.
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    application/javascript
    application/json
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

# Vite filenames contain a content hash, so they are safe to cache for one year.
location ^~ /build/assets/ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
